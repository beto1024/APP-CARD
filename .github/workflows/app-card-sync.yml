name: APP CARD - sincronizar Google Drive
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run sync
        env:
          APP_CARD_SUPABASE_URL: ${{ secrets.APP_CARD_SUPABASE_URL }}
          APP_CARD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.APP_CARD_SUPABASE_SERVICE_ROLE_KEY }}
          APP_CARD_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.APP_CARD_GOOGLE_SERVICE_ACCOUNT_JSON }}
